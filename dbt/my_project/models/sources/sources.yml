version: 2

sources:
  - name: dev
    database: weather_db
    tables:
    - name: raw_weather_data
      columns:
        - name: id
          tests:
            - not_null
            - unique
        - name: city
          tests:
            - not_null
        - name: lat
        - name: lon
        - name: temperature
          tests:
            - not_null
        - name: feels_like
        - name: temp_min
        - name: temp_max
        - name: humidity
        - name: pressure
        - name: weather_main
        - name: weather_description
        - name: wind_speed
        - name: wind_deg
        - name: clouds
        - name: visibility
        - name: observed_at
          tests:
            - not_null
        - name: inserted_at