version: 2

models:
  - name: daily_weather
    description: Daily aggregated weather metrics per city, optimized for dashboard consumption
    columns:
      - name: city_name
        description: City name
        tests:
          - not_null
      - name: weather_date
        description: Date in Asia/Jakarta timezone
        tests:
          - not_null
      - name: avg_temp_c
        description: Average temperature in Celsius
      - name: min_temp_c
        description: Minimum temperature in Celsius
      - name: max_temp_c
        description: Maximum temperature in Celsius
      - name: avg_humidity
        description: Average humidity percentage
      - name: avg_pressure
        description: Average pressure in hPa
      - name: avg_wind_ms
        description: Average wind speed in m/s
      - name: observation_count
        description: Number of observations per day
        tests:
          - not_null
